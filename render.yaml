# Render Blueprint: a free web service built from the Dockerfile.
services:
  - type: web
    name: shipping-doc-verifier
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # "all" serves the pre-computed answers in demo/jev_cache (no key on the host, so no credits can be
      # spent: an uncached question simply falls back to the rule tier). "off" would hide them.
      - key: SDV_JEV
        value: "all"
      - key: SDV_VISION
        value: "off"
