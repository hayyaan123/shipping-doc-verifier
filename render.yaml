# Render Blueprint: a free web service built from the Dockerfile.
services:
  - type: web
    name: shipping-doc-verifier
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SDV_JEV
        value: "off"
      - key: SDV_VISION
        value: "off"
