<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipping Desk</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14181f;--mute:#5c6675;--line:#e3e6ec;--ok:#137a3f;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fdeceb;--rev:#a15c00;--revbg:#fff3e0;--acc:#1d4ed8;--accbg:#e8eefc}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--panel:#171b23;--ink:#e8ebf0;--mute:#9aa4b2;--line:#2a303b;--ok:#4cc38a;--okbg:#12281d;--bad:#ff8a80;--badbg:#301716;--rev:#f5b25a;--revbg:#2f2410;--acc:#8fb0ff;--accbg:#1a2440}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);font-weight:600}
.sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:8px}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:1280px;margin:0 auto;padding:16px 20px 40px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat span{color:var(--mute);font-size:12px}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.rev b{color:var(--rev)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.chip{padding:4px 11px;border-radius:99px;font-size:13px}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:200px}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{border-collapse:collapse;width:100%}.scroll table{min-width:520px}
th{font-size:12px;color:var(--mute);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}tbody tr.sel{background:var(--accbg)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.OK{background:var(--okbg);color:var(--ok)}.tag.MISMATCH{background:var(--badbg);color:var(--bad)}.tag.NEEDS_REVIEW{background:var(--revbg);color:var(--rev)}.tag.other{background:var(--bg);color:var(--mute)}
.subj{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{max-height:70vh;overflow:auto}
.detail{padding:14px 16px}.detail h2{margin:0 0 2px;font-size:15px}.muted{color:var(--mute)}
.detail h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:16px 0 6px}
.v-match{color:var(--ok)}.v-mismatch{color:var(--bad);font-weight:650}.v-uncertain{color:var(--rev);font-weight:650}
.cmp td,.cmp th{padding:6px 8px}.cmp tr.hot td{background:var(--badbg)}.cmp tr.unc td{background:var(--revbg)}
.note{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-height:54px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.empty{padding:40px;text-align:center;color:var(--mute)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Shipping Desk</h1><span class="badge" id="mode">…</span>
  <span class="muted" id="sub"></span><span class="sp"></span>
  <button id="retry" title="Re-run emails whose processing failed">Retry failed</button>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>
  <div class="grid">
    <div class="panel"><div class="scroll"><table><thead><tr><th>Email</th><th>Subject</th><th>Category</th><th>Result</th></tr></thead><tbody id="rows"></tbody></table></div><div class="empty" id="none" hidden>No cases match.</div></div>
    <div class="panel"><div class="detail" id="detail"><div class="empty">Select a case to see the evidence.</div></div></div>
  </div>
</main>
<script>
/*__SNAPSHOT__*/
const SNAP = (typeof window.__SNAPSHOT__ !== "undefined") ? window.__SNAPSHOT__ : null;
const LABEL = {shipper:"Shipper",consignee:"Consignee",notify_party:"Notify party",port_of_loading:"Port of loading",port_of_discharge:"Port of discharge",container_count:"Container count",gross_weight_kg:"Gross weight (kg)"};
const REASON = {unreadable:"Unreadable document",wrong_doc_type:"Wrong document type",missing_attachment:"Missing attachment",missing_value:"Missing value"};
let cases = [], sel = null, f = {view:"attention", q:""};
const $ = id => document.getElementById(id), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, opt){ const r = await fetch(path, opt); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function load(){
  cases = SNAP ? SNAP.cases : await api("/api/cases");
  render();
}
function stats(){
  const cmp = cases.filter(c => c.category === "BL_COMPARISON"), n = s => cmp.filter(c => c.status === s).length;
  const wait = cmp.filter(c => (c.status !== "OK") && !c.review).length, failed = cases.filter(c => c.error).length;
  const box = (k, v, cl="") => `<div class="stat ${cl}"><b>${v}</b><span>${k}</span></div>`;
  $("stats").innerHTML = box("Emails", cases.length) + box("Document checks", cmp.length) + box("Clean", n("OK"), "ok") +
    box("Mismatches", n("MISMATCH"), "bad") + box("Needs review", n("NEEDS_REVIEW"), "rev") + box("Awaiting a person", wait, "rev") + (failed ? box("Failed to process", failed, "bad") : "");
}
function bar(){
  const views = [["attention","Needs attention"],["all","All emails"],["MISMATCH","Mismatches"],["NEEDS_REVIEW","Needs review"],["OK","Clean"],["decided","Decided"]];
  $("bar").innerHTML = views.map(([k,l]) => `<button class="chip ${f.view===k?"on":""}" data-v="${k}">${l}</button>`).join("") +
    `<span class="sp"></span><input type="search" id="q" placeholder="Search id or subject" value="${esc(f.q)}">`;
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { f.view = b.dataset.v; render(); });
  $("q").oninput = e => { f.q = e.target.value; renderRows(); };
}
function visible(){
  return cases.filter(c => {
    const cmp = c.category === "BL_COMPARISON";
    if (f.view === "attention" && !(cmp && c.status !== "OK" && !c.review) && !c.error) return false;
    if (["MISMATCH","NEEDS_REVIEW","OK"].includes(f.view) && !(cmp && c.status === f.view)) return false;
    if (f.view === "decided" && !c.review) return false;
    const q = f.q.trim().toLowerCase();
    return !q || c.email_id.toLowerCase().includes(q) || (c.subject||"").toLowerCase().includes(q);
  });
}
function tag(c){
  if (c.error) return `<span class="tag MISMATCH">FAILED</span>`;
  if (c.category !== "BL_COMPARISON") return `<span class="tag other">–</span>`;
  return `<span class="tag ${c.status}">${c.status.replace("_"," ")}</span>` + (c.review ? ` <span class="muted">✓ decided</span>` : "");
}
function renderRows(){
  const v = visible();
  $("rows").innerHTML = v.map(c => `<tr data-id="${esc(c.email_id)}" class="${sel===c.email_id?"sel":""}"><td><code>${esc(c.email_id)}</code></td><td class="subj" title="${esc(c.subject)}">${esc(c.subject)}</td><td class="muted">${esc(c.category)}</td><td>${tag(c)}</td></tr>`).join("");
  $("none").hidden = v.length > 0;
  document.querySelectorAll("#rows tr").forEach(tr => tr.onclick = () => { sel = tr.dataset.id; renderRows(); detail(); });
}
function detail(){
  const c = cases.find(x => x.email_id === sel); if (!c) return;
  let h = `<h2>${esc(c.subject)}</h2><div class="muted"><code>${esc(c.email_id)}</code> · ${esc(c.category)} · classified by <b>${esc(c.category_method)}</b> (${Math.round((c.category_confidence||0)*100)}%)</div>`;
  if (c.error) h += `<h3>Processing failure</h3><div class="note v-mismatch">${esc(c.error)}</div><div class="muted">This is a system failure, not a verdict. Use “Retry failed”.</div>`;
  if (c.category === "BL_COMPARISON" && !c.error){
    h += `<h3>Result</h3><div>${tag(c)}${c.review_reason ? ` <b>${esc(REASON[c.review_reason]||c.review_reason)}</b>`:""}</div>`;
    if (c.evidence?.review_detail) h += `<div class="note">${esc(c.evidence.review_detail)}</div>`;
    else h += `<div class="note">${esc(c.summary)}</div>`;
    if ((c.comparisons||[]).length){
      h += `<h3>Field comparison (SI vs draft BL)</h3><table class="cmp"><thead><tr><th>Field</th><th>SI</th><th>BL</th><th></th></tr></thead><tbody>` +
        c.comparisons.map(x => `<tr class="${x.verdict==="mismatch"?"hot":x.verdict==="uncertain"?"unc":""}"><td>${esc(LABEL[x.field]||x.field)}</td><td>${esc(x.si_value)}</td><td>${esc(x.bl_value)}</td><td class="v-${x.verdict}">${x.verdict}${x.reason&&x.verdict!=="mismatch"?`<div class="muted" style="font-weight:400">${esc(x.reason)}</div>`:""}</td></tr>`).join("") + `</tbody></table>`;
    }
    const docs = c.evidence?.documents || [];
    if (docs.length) h += `<h3>Documents</h3>` + docs.map(d => `<div class="note"><code>${esc(d.name)}</code> · read as <b>${esc(d.type)}</b>${d.readable?"":` · <span class="v-uncertain">${esc(d.error)}</span>`}</div>`).join("");
    const sr = c.evidence?.scan_reading;
    if (sr){
      h += `<h3>Scan reading (unverified)</h3><div class="note">${esc(sr.summary || "The scan was read, but no comparison was possible.")}</div>` +
        (sr.documents||[]).map(d => `<div class="note"><code>${esc(d.name)}</code> · ${esc(d.engine)}<br>` + Object.entries(d.fields).map(([k,v]) => `${esc(LABEL[k]||k)}: <b>${esc(v)}</b>`).join("<br>") + `</div>`).join("");
    }
    if (c.status !== "OK"){
      h += `<h3>Decision</h3>`;
      if (c.review) h += `<div class="note"><b>${esc(c.review.decision.replace("_"," "))}</b>${c.review.note?` — ${esc(c.review.note)}`:""}</div>`;
      h += `<textarea id="note" placeholder="Note for the record (optional)" ${SNAP?"disabled":""}></textarea><div class="acts">` +
        [["confirmed_defect","Confirm defect","pri"],["dismissed","Dismiss as false alarm",""],["reviewed_ok","Reviewed – fine",""]].map(([d,l,cl]) => `<button class="${cl}" data-d="${d}" ${SNAP?"disabled":""}>${l}</button>`).join("") + `</div>` +
        (SNAP ? `<div class="muted" style="margin-top:6px">Read-only snapshot. Run the live console to record decisions.</div>` : "");
    }
  }
  const notes = c.evidence?.triage_notes || [];
  if (notes.length) h += `<h3>How it was classified</h3>` + notes.map(n => `<div class="note">${esc(n)}</div>`).join("");
  $("detail").innerHTML = h;
  document.querySelectorAll(".acts button").forEach(b => b.onclick = async () => {
    await api(`/api/cases/${encodeURIComponent(c.email_id)}/review`, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({decision:b.dataset.d, note:$("note").value})});
    await load(); detail();
  });
}
function render(){ stats(); bar(); renderRows(); if (sel) detail(); }
$("mode").textContent = SNAP ? "Snapshot (read-only)" : "Live";
$("sub").textContent = SNAP ? `exported ${SNAP.exported_at}` : "";
$("retry").disabled = !!SNAP;
$("retry").onclick = async () => { $("retry").textContent = "Retrying…"; try { const r = await api("/api/retry", {method:"POST"}); $("retry").textContent = `Retried ${r.retried}, recovered ${r.recovered}`; } catch(e){ $("retry").textContent = "Retry failed"; } await load(); };
load();
</script>
</body>
</html>
